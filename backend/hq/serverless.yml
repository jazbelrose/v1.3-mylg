service: hq
frameworkVersion: '3'

useDotenv: true

custom:
  env: ${file(../serverless.common.yml):env}

provider:
  name: aws
  runtime: nodejs18.x
  region: us-west-2
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  httpApi:
    authorizers:
      jwtAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.us-west-2.amazonaws.com/us-west-2_EmStQTtG1
        audience:
          - 6f5f1vsm5bejjaffihc3e0n95k
  environment:
    ${self:custom.env}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:DescribeTable
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.env.HQ_TABLE}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.env.ORG_MEMBERS_TABLE}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.env.ORG_MEMBERS_TABLE}/index/*
        - Effect: Allow
          Action:
            - s3:DeleteObject
            - s3:DeleteObjects
          Resource:
            - arn:aws:s3:::${self:custom.env.FILE_BUCKET}/orgs/*
            - arn:aws:s3:::${self:custom.env.FILE_BUCKET}/public/orgs/*

functions:
  hqRouter:
    handler: router.handler
    layers:
      - ${cf:shared-layer-${sls:stage}.SharedUtilsLayerArn}
    events:
      - httpApi:
          path: /hq
          method: GET
          authorizer:
            name: jwtAuthorizer
      - httpApi:
          path: /hq
          method: POST
          authorizer:
            name: jwtAuthorizer
      - httpApi:
          path: /hq
          method: DELETE
          authorizer:
            name: jwtAuthorizer
      - httpApi:
          path: /hq/{proxy+}
          method: GET
          authorizer:
            name: jwtAuthorizer
      - httpApi:
          path: /hq/{proxy+}
          method: POST
          authorizer:
            name: jwtAuthorizer
      - httpApi:
          path: /hq/{proxy+}
          method: PATCH
          authorizer:
            name: jwtAuthorizer
      - httpApi:
          path: /hq/{proxy+}
          method: DELETE
          authorizer:
            name: jwtAuthorizer
      - httpApi:
          path: /hq/health
          method: GET
          authorizer:
            name: jwtAuthorizer
      # CORS preflight (no auth)
      - httpApi:
          path: /hq
          method: OPTIONS
      - httpApi:
          path: /hq/{proxy+}
          method: OPTIONS
      - httpApi:
          path: /hq/health
          method: OPTIONS

package:
  patterns:
    - '**/*'
    - '!node_modules/.bin/**'
    - '!**/*.map'

service: mylg-realtime-deck
frameworkVersion: '3'

useDotenv: true

custom:
  env: ${file(../serverless.common.yml):env}

provider:
  name: aws
  runtime: nodejs18.x
  region: us-west-2
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  websocketsApiName: ${self:service}-${sls:stage}
  websocketsApiRouteSelectionExpression: $request.body.action
  environment:
    DECK_CONNECTIONS_TABLE: ${self:custom.env.DECK_CONNECTIONS_TABLE}
    DECK_CONNECTIONS_DECK_GSI: ${self:custom.env.DECK_CONNECTIONS_DECK_GSI}
    DECK_PAGES_TABLE: ${self:custom.env.DECK_PAGES_TABLE}
    DECK_WEBSOCKET_ENDPOINT: ${self:custom.env.DECK_WEBSOCKET_ENDPOINT}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:GetItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.env.DECK_CONNECTIONS_TABLE}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.env.DECK_CONNECTIONS_TABLE}/index/*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.env.DECK_PAGES_TABLE}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.env.DECK_PAGES_TABLE}/index/*
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource: arn:aws:execute-api:${aws:region}:${aws:accountId}:*/${sls:stage}/POST/@connections/*

functions:
  deckOnConnect:
    handler: onConnect.handler
    events:
      - websocket:
          route: $connect

  deckOnDisconnect:
    handler: onDisconnect.handler
    events:
      - websocket:
          route: $disconnect

  deckJoin:
    handler: joinDeck.handler
    events:
      - websocket:
          route: joinDeck

  deckPatch:
    handler: deckPatch.handler
    events:
      - websocket:
          route: deckPatch
      - websocket:
          route: deckSave

  deckDefault:
    handler: default.handler
    events:
      - websocket:
          route: $default

  exportDeck:
    handler: exportDeck.handler
    events:
      - httpApi:
          method: post
          path: /deck/export

resources:
  Resources:
    DeckRealtimeConnections:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.env.DECK_CONNECTIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: deckKey
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ${self:custom.env.DECK_CONNECTIONS_DECK_GSI}
            KeySchema:
              - AttributeName: deckKey
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    DeckPages:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.env.DECK_PAGES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: projectId
            AttributeType: S
          - AttributeName: pageId
            AttributeType: S
        KeySchema:
          - AttributeName: projectId
            KeyType: HASH
          - AttributeName: pageId
            KeyType: RANGE

package:
  patterns:
    - '*.mjs'
    - '!**/*.map'

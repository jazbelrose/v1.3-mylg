<!--
  SpendIcon - Lucide-compatible SVG
  
  A money circulation icon showing a dollar sign with two curved arrows
  forming a cycle around it.
  
  Usage:
  - Drag-and-drop into Figma
  - Use as img src
  - Copy paths into existing icon system
  
  Specs:
  - 24×24 viewBox (Lucide standard)
  - stroke-only, no fills
  - strokeWidth = 2
  - strokeLinecap = "round", strokeLinejoin = "round"
-->
<svg 
  xmlns="http://www.w3.org/2000/svg" 
  width="24" 
  height="24" 
  viewBox="0 0 24 24" 
  fill="none" 
  stroke="currentColor" 
  stroke-width="2" 
  stroke-linecap="round" 
  stroke-linejoin="round"
>
  <!-- Dollar sign - vertical bar -->
  <line x1="12" y1="7.5" x2="12" y2="16.5" />
  
  <!-- Dollar sign - S curve -->
  <path d="M15 9H10.5a1.5 1.5 0 0 0 0 3h3a1.5 1.5 0 0 1 0 3H9" />
  
  <!-- Top curved arrow - sweeps over top from left to right -->
  <path d="M5.5 13.5a8 8 0 0 1 13 0" />
  
  <!-- Top arrowhead - points down-right -->
  <path d="M16 11l2.5 2.5-2.5 2.5" />
  
  <!-- Bottom curved arrow - sweeps under bottom from right to left -->
  <path d="M18.5 10.5a8 8 0 0 1-13 0" />
  
  <!-- Bottom arrowhead - points up-left -->
  <path d="M8 8l-2.5 2.5 2.5 2.5" />
</svg>
